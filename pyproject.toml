[project]
name = "kobolib"
version = "0.2.0"
description = "Alfred workflow: search an ebook library by metadata, with covers"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kobolib = "kobolib.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kobolib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["SIM112"]

[tool.ruff.lint.per-file-ignores]
"tests/test_filenames.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kobolib", "tests"]
