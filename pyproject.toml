[project]
name = "kobolib"
version = "0.1.0"
description = "Alfred workflow: search an ebook library by metadata, with covers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kobolib = "kobolib.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kobolib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
