name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --frozen --python ${{ matrix.python }} ruff check
      - run: uv run --frozen --python ${{ matrix.python }} ruff format --check
      - run: uv run --frozen --python ${{ matrix.python }} pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Kobold.alfredworkflow
          path: dist/Kobold.alfredworkflow
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kobold.alfredworkflow
          path: dist
      - if: env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG == 'latest' && 'Latest build' || env.TAG }}
          prerelease: ${{ env.TAG == 'latest' }}
          generate_release_notes: ${{ env.TAG != 'latest' }}
          files: dist/Kobold.alfredworkflow
